<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Trading with Order Book</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .trading-panel {
            padding: 20px;
        }
        .order-book, .place-order {
            margin-top: 20px;
        }
        .order-book table {
            width: 100%;
            border-collapse: collapse;
        }
        .order-book th, .order-book td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }
        .order-book th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<div class="container trading-panel">
    <h2>Feature Trading Panel</h2>

    <!-- Order Form -->
    <div class="place-order">
        <h3>Place an Order</h3>
        <form id="orderForm">
            <div class="form-row">
                <div class="col">
                    <label for="orderType">Order Type</label>
                    <select class="form-control" id="orderType" required>
                        <option value="buy">Buy</option>
                        <option value="sell">Sell</option>
                    </select>
                </div>
                <div class="col">
                    <label for="price">Price</label>
                    <input type="number" class="form-control" id="price" placeholder="Price" required>
                </div>
                <div class="col">
                    <label for="amount">Amount</label>
                    <input type="number" class="form-control" id="amount" placeholder="Amount" required>
                </div>
                <div class="col">
                    <button type="submit" class="btn btn-primary mt-4">Place Order</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Order Book -->
    <div class="order-book">
        <h3>Order Book</h3>
        <table>
            <thead>
            <tr>
                <th>Order Type</th>
                <th>Price</th>
                <th>Amount</th>
            </tr>
            </thead>
            <tbody id="orderBookBody">
            <!-- Dynamic Order Book -->
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    // Array to store the orders
    let orderBook = [];

    // Handle form submission
    $("#orderForm").on("submit", function(e) {
        e.preventDefault();

        // Get form values
        const orderType = $("#orderType").val();
        const price = $("#price").val();
        const amount = $("#amount").val();

        if (price > 0 && amount > 0) {
            // Add new order to the orderBook
            const newOrder = { orderType, price, amount };
            orderBook.push(newOrder);

            // Update the order book display
            updateOrderBook();
        } else {
            alert('Price and Amount should be greater than zero.');
        }

        // Clear the form
        $("#orderForm")[0].reset();
    });

    // Function to update the order book table
    function updateOrderBook() {
        const orderBookBody = $("#orderBookBody");
        orderBookBody.empty(); // Clear the table

        // Populate the table with current orders
        orderBook.forEach(order => {
            const row = `<tr>
                <td>${order.orderType.toUpperCase()}</td>
                <td>${parseFloat(order.price).toFixed(2)}</td>
                <td>${parseFloat(order.amount).toFixed(2)}</td>
            </tr>`;
            orderBookBody.append(row);
        });
    }
</script>

</body>
</html>
